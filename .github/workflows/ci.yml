name: Package checks

on:
  pull_request:
  push:
    branches:
      - master
      - feature/reusable-qr-code

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check library and demo
        run: npm run typecheck
      - name: Build and run unit tests
        run: npm run test:unit
